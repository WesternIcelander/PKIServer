# Reverse proxy for PKIServer.
#
# - Port 80 (plain HTTP): the public files (certificates, CRLs, index page). AIA and CRL
#   Distribution Point fetchers often can't do HTTPS, so there is NO redirect to HTTPS here
#   and no HSTS header for this host name. /api/* is refused here, before the body is sent on.
# - Port 443 (HTTPS): everything, including the upload API.
#
# Both set X-Forwarded-Proto to the scheme the client actually used, replacing anything the
# client sent. PKIServer accepts /api/* only from a trusted proxy that says "https"; it is the
# authority on that, the 403 on port 80 below is just an early refusal.

events {}

http {
    upstream pkiserver {
        server pkiserver:8080;
        keepalive 16;
    }

    # Uploads are small (certificates, CRLs); PKIServer enforces limits.maxUploadBytes itself.
    client_max_body_size 2m;
    server_tokens off;

    server {
        listen 80;
        listen [::]:80;
        server_name pki.example.com;

        location /api/ {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 403 '{"error":"the API is only available over HTTPS"}\n';
        }

        location / {
            # Public files are read-only; don't accept request bodies over plain HTTP.
            limit_except GET HEAD { deny all; }
            proxy_pass http://pkiserver;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name pki.example.com;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://pkiserver;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Stream upload bodies through; PKIServer checks the size and the HTTPS gate.
            proxy_request_buffering off;
        }
    }
}
