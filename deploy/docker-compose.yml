# PKIServer behind nginx. nginx is the only way in: it serves the public files on plain
# HTTP (port 80) and everything, including /api/*, on HTTPS (port 443). PKIServer's own
# port is not published, so the only address that can reach it is nginx's fixed address,
# which is the one trusted proxy in config.json.
#
#   cd deploy
#   cp config.example.json config.json      # adjust, keep trustedProxies = nginx's address
#   mkdir tls && cp fullchain.pem privkey.pem tls/
#   (edit server_name in nginx.conf)
#   docker compose up -d --build
services:
  pkiserver:
    build: ..
    image: pkiserver
    restart: unless-stopped
    volumes:
      - pkiserver-data:/data
      - ./config.json:/etc/pkiserver/config.json:ro
    networks:
      - pki

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - pkiserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      pki:
        ipv4_address: 172.30.0.2

networks:
  pki:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses (PKIServer, one-off admin containers) come from the upper
          # half, so nothing else can ever be given nginx's fixed address.
          ip_range: 172.30.0.128/25

volumes:
  pkiserver-data:
